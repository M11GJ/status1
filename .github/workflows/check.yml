name: DCC AI Status Check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: status-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run check
        run: python3 scripts/check.py

      - name: Commit result
        run: |
          git config user.name "dcc-status-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update status $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
